<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>InstaShield'i İndir</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 24px; text-align: center; color: #1a1a1a; background: #fff; }
  p { color: #666; margin: 0 0 20px; }
  a.btn { display: inline-block; background: #1E3866; color: #fff; text-decoration: none; font-weight: 600; padding: 14px 28px; border-radius: 12px; }
  a.secondary { display: inline-block; margin-top: 16px; color: #666; text-decoration: underline; font-size: 14px; }
</style>
</head>
<body>
<p>App Store'a yönlendiriliyorsun…</p>
<!--
  Confirmed live (screenshot from inside Instagram's in-app browser): the
  page itself loads fine, but itms-apps:// and a plain https link both stay
  trapped inside Instagram's WebView on tap — Instagram intercepts the tap
  before iOS ever gets to decide whether a native app/Safari should handle
  it, so no scheme that still navigates *within this WebView* can escape it.
  x-safari-https:// is different: it's an explicit OS-level instruction
  ("launch Safari specifically for this URL"), not a page navigation, which
  is why in-app browsers that swallow itms-apps/https still tend to honor
  it. Safari itself doesn't understand this prefix, so the visible fallback
  link keeps the plain https version for when the page is opened somewhere
  that isn't a wrapping in-app browser at all.
-->
<a class="btn" id="link" href="x-safari-https://apps.apple.com/tr/app/instashield-unfollower-tracker/id6791182463">App Store'da Aç</a>
<a class="secondary" href="https://apps.apple.com/tr/app/instashield-unfollower-tracker/id6791182463">Açılmadıysa buraya dokun</a>
<script>
  window.location.href = "x-safari-https://apps.apple.com/tr/app/instashield-unfollower-tracker/id6791182463";
</script>
</body>
</html>
