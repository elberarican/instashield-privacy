<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>InstaShield'i İndir</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 24px; text-align: center; color: #1a1a1a; background: #fff; }
  p { color: #666; margin: 0 0 20px; }
  a.btn { display: inline-block; background: #1E3866; color: #fff; text-decoration: none; font-weight: 600; padding: 14px 28px; border-radius: 12px; }
  a.secondary { display: inline-block; margin-top: 16px; color: #666; text-decoration: underline; font-size: 14px; }
</style>
</head>
<body>
<p>App Store'a yönlendiriliyorsun…</p>
<!--
  Instagram's in-app browser doesn't reliably follow a plain https App Store
  link (neither an automatic JS redirect nor a real tap on it) — reported
  live: the page loads fine, but neither the auto-redirect nor the manual
  "tap here" button actually opened the App Store. itms-apps:// is Apple's
  own URL scheme for opening the App Store app directly instead of loading
  a web page for it, which restrictive in-app browsers hand off to the OS
  more reliably than a Universal Link over https. Kept the https link as a
  visible secondary fallback in case a given browser doesn't recognize the
  itms-apps scheme at all.
-->
<a class="btn" id="link" href="itms-apps://apps.apple.com/app/id6791182463" target="_blank" rel="noopener noreferrer">App Store'da Aç</a>
<a class="secondary" href="https://apps.apple.com/tr/app/instashield-unfollower-tracker/id6791182463" target="_blank" rel="noopener noreferrer">Açılmadıysa buraya dokun</a>
<script>
  window.location.href = "itms-apps://apps.apple.com/app/id6791182463";
  setTimeout(function () {
    window.location.href = "https://apps.apple.com/tr/app/instashield-unfollower-tracker/id6791182463";
  }, 1500);
</script>
</body>
</html>
